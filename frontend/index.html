<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Media kit and audience stats for RythonDev."
		/>
		<meta name="viewport" content="width=device-width" />
		<meta
			name="keywords"
			content="Rython, developer, frontend, web developer, streamer, coworking"
		/>
		<meta name="theme-color" content="#54E9FA" />
		<meta name="twitter:image" content="/images/preview.webp" />
		<title>RythonDev's Media Kit</title>
		<script>
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem("theme");
				} catch {}
				const dark =
					stored === "dark" ||
					(stored !== "light" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
	</head>
	<body
		class="bg-white text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-50"
	>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
